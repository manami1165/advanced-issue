# CI: テスト（カバレッジ計測付き）を実行する
# DB は jest.mock でモックしているので、PostgreSQL は不要
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # deploy.yml から呼び出せるようにする
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          # EC2（nvm install --lts）と同じメジャーバージョンにそろえる
          node-version: "24"
          cache: "npm"

      - name: 依存関係をインストール
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: テストを実行（カバレッジ計測付き。70% 未満なら失敗）
        run: npm run test:coverage

      - name: カバレッジレポートをアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
